<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کودک انگلیسی - Koodak English</title>
  <meta name="description" content="یادگیری زبان انگلیسی برای کودکان ۲ تا ۶ سال - Free English learning for Iranian children ages 2-6">
  <meta name="theme-color" content="#e91e63">

  <!-- Fonts: Vazirmatn (Farsça) + Fredoka/Nunito (English, kid-friendly) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="brand">
      <span class="logo" aria-hidden="true">📚</span>
      <div class="brand-text">
        <h1 data-i18n="site.title">کودک انگلیسی</h1>
        <p class="brand-sub" data-i18n="site.subtitle">یادگیری انگلیسی برای کودکان</p>
      </div>
    </div>
    <nav class="lang-switcher" aria-label="Language">
      <button class="lang-btn active" data-lang="fa" aria-label="فارسی">🇮🇷 فارسی</button>
      <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
    </nav>
  </header>

  <nav class="categories" aria-label="Categories">
    <button class="cat-btn active" data-category="alphabet">🔤 <span data-i18n="cat.alphabet">حروف الفبا</span></button>
    <button class="cat-btn" data-category="numbers" disabled>🔢 <span data-i18n="cat.numbers">اعداد</span></button>
    <button class="cat-btn" data-category="colors" disabled>🎨 <span data-i18n="cat.colors">رنگ ها</span></button>
    <button class="cat-btn" data-category="shapes" disabled>🔷 <span data-i18n="cat.shapes">اشکال</span></button>
    <button class="cat-btn" data-category="animals" disabled>🐾 <span data-i18n="cat.animals">حیوانات</span></button>
    <button class="cat-btn" data-category="fruits" disabled>🍎 <span data-i18n="cat.fruits">میوه ها</span></button>
    <button class="cat-btn" data-category="family" disabled>👨‍👩‍👧 <span data-i18n="cat.family">خانواده</span></button>
    <button class="cat-btn" data-category="songs" disabled>🎵 <span data-i18n="cat.songs">آهنگ ها</span></button>
  </nav>

  <main class="content" role="main">
    <!-- Alphabet section -->
    <section id="alphabet-section" class="section active" aria-labelledby="alphabet-title">
      <h2 id="alphabet-title" data-i18n="alphabet.title">حروف الفبا</h2>
      <p class="section-desc" data-i18n="alphabet.desc">روی هر حرف کلیک کنید تا کلمه و تلفظ آن را بشنوید</p>

      <div class="progress-info">
        <span class="progress-label" data-i18n="progress.label">پیشرفت:</span>
        <span id="progress-count" class="progress-count">0</span>
        <span>/</span>
        <span id="progress-total">26</span>
        <button id="reset-progress" class="reset-btn" data-i18n="progress.reset">بازنشانی</button>
      </div>

      <div id="alphabet-grid" class="alphabet-grid" role="list" aria-live="polite">
        <!-- generated by JS -->
      </div>
    </section>

    <!-- Placeholder for other sections -->
    <section id="other-sections" class="coming-soon">
      <p data-i18n="coming.soon">سایر بخش ها به زودی اضافه می شوند 🌱</p>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <h3 data-i18n="contact.title">تماس با ما</h3>
    <p class="footer-intro" data-i18n="contact.intro">نظرات و پیشنهادات خود را با ما در میان بگذارید</p>

    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" class="contact-form">
      <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
      <input type="hidden" name="subject" value="Koodak English - New Message">
      <input type="hidden" name="from_name" value="Koodak English Website">
      <!-- Honeypot spam protection -->
      <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

      <div class="form-row">
        <label for="name" data-i18n="contact.name">نام</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="form-row">
        <label for="email" data-i18n="contact.email">ایمیل</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-row">
        <label for="message" data-i18n="contact.message">پیام</label>
        <textarea id="message" name="message" rows="4" required></textarea>
      </div>

      <button type="submit" class="submit-btn" data-i18n="contact.send">ارسال پیام</button>

      <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
    </form>

    <p class="footer-note">
      <span data-i18n="footer.built">ساخته شده با ❤️ برای کودکان ایران</span>
    </p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
